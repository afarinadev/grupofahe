<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mensaje enviado · Grupo FAHE</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#040a1a">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>document.documentElement.classList.add('js');</script>
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <main id="main">
    <section class="hero hero-center">
      <span class="orb orb-a" aria-hidden="true"></span>
      <span class="orb orb-b" aria-hidden="true"></span>
      <div class="container">
        <div class="reveal">
          <span class="icon-glow" style="width: 76px; height: 76px; font-size: 2.2rem; border-radius: 50%; margin: 0 auto 1.8rem;"><i class="ti ti-circle-check" aria-hidden="true"></i></span>
          <h1>¡Gracias! <span class="line serif grad">Ya lo hemos recibido</span></h1>
          <p class="lead">Te responderemos lo antes posible al correo que nos has dejado.</p>
          <div class="hero-actions">
            <a class="btn btn-gold btn-lg" href="index.html" id="volver"><i class="ti ti-arrow-left" aria-hidden="true"></i> Volver a la web</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    // Vuelve a la página desde la que se envió el formulario (solo páginas de esta web)
    (function () {
      var ok = ['index.html', 'hospederias.html', 'infaes.html', 'caldasgo.html'];
      var p = new URLSearchParams(location.search).get('volver');
      if (ok.indexOf(p) !== -1) document.getElementById('volver').setAttribute('href', p);
      var themes = { 'infaes.html': 'theme-infaes', 'caldasgo.html': 'theme-go' };
      if (themes[p]) document.body.classList.add(themes[p]);
    })();
  </script>
</body>
</html>
